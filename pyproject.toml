[project]
name = "ktrade"
version = "0.1.0"
description = "Paper-trading lab where Claude proposes crypto trades and a fixed risk engine sizes them, scored against a rules-only baseline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ktrade*"]

[tool.setuptools.package-data]
ktrade = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
